<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Sean Collins (SMC17) - Zero-allocation Zig and Elixir systems">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7a41d"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Decorative H3 Hexagons on Right -->
  <g transform="translate(970,140)" fill="none" stroke-width="1.6" opacity="0.85">
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" stroke="#10b981" fill="#10b981" fill-opacity="0.08"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" stroke="#38bdf8" stroke-opacity="0.7"/>
    <polygon points="90,-10 120,7 120,41 90,58 60,41 60,7" stroke="#f7a41d" stroke-opacity="0.55"/>
    <polygon points="-90,-52 -60,-35 -60,-1 -90,16 -120,-1 -120,-35" stroke="#38bdf8" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="4" fill="#10b981"/>
  </g>

  <!-- Terminal Header Dots -->
  <circle cx="48" cy="40" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="68" cy="40" r="6" fill="#f59e0b" opacity="0.85"/>
  <circle cx="88" cy="40" r="6" fill="#10b981" opacity="0.85"/>
  <text x="112" y="45" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">smc17@github ~ % zig build -Doptimize=ReleaseFast</text>

  <!-- Main Title -->
  <text x="48" y="112" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">Sean Collins</text>
  <text x="328" y="112" fill="#f7a41d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="600">@SMC17</text>
  <text x="48" y="148" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">Zero-allocation libraries &amp; systems tooling in Zig and Elixir.</text>

  <!-- Pill Badges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="48" y="182" width="188" height="32" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="64" y="203" fill="#f7a41d">202 C ABI symbols</text>

    <rect x="248" y="182" width="168" height="32" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="264" y="203" fill="#38bdf8">33 KB wasm32</text>

    <rect x="428" y="182" width="178" height="32" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="444" y="203" fill="#10b981">substrate mcp</text>

    <rect x="618" y="182" width="230" height="32" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="634" y="203" fill="#e2e8f0">Zig · C · Python · Elixir</text>
  </g>

  <text x="48" y="246" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">brew install smc17/tap/substrate  ·  https://smc17.github.io/zinging/  ·  https://smc17.github.io/strip/</text>
</svg>
